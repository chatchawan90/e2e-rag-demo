[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "envsearch"
version = "0.1.0"
description = "Cited Q&A over public environmental regulations (US EPA + Thai DIW/PCD), with an eval set and an MCP server for Claude Desktop."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "anthropic>=0.60",
  "mcp[cli]>=1.30,<2",
  "pymupdf>=1.24",
  "rank-bm25>=0.2.2",
  "numpy>=1.26",
  "filelock>=3",
  "pythainlp>=5.0",
  "pyyaml>=6",
  "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
vectors = ["sentence-transformers>=3,<6"]
web = ["streamlit[pdf]>=1.49,<2", "python-dotenv>=1", "openai>=1.68,<3"]
hosted = ["onnxruntime>=1.20,<2", "sentencepiece>=0.2,<1", "huggingface-hub>=0.30,<2", "uvicorn>=0.30,<1"]

[project.scripts]
envsearch = "envsearch.cli:main"
envsearch-mcp = "envsearch.mcp_server:main"
envsearch-mcp-http = "envsearch.mcp_http:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
